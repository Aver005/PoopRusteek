name: Build

# Release-бинарники всех платформ + установщик Windows. Результат — артефакты
# `bin-<target>` и `installer-windows`; публикуют их ci.yml (dev) и release.yml (stable).
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `target` — контракт с src/update/mod.rs::platform_target. Все цели обязательны.
        include:
          - { target: windows-x86_64, os: windows-latest }
          - { target: windows-arm64, os: windows-11-arm }
          - { target: linux-x86_64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Свежий Xcode на macos-latest без clang_rt.osx, нужного aws-lc-sys: берём stable.
      - name: Select stable Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build release binary
        run: cargo build --release --locked --bin pooprusteek
      - name: Package
        shell: bash
        run: bash scripts/ci/package.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  installer:
    name: Windows installer
    needs: binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-windows-*
          merge-multiple: true
          path: bins
      # Версия зафиксирована: на раннере через Chocolatey только 6.x.
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile is.exe
          Start-Process .\is.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS','/DIR=C:\InnoSetup7' -Wait
          C:\InnoSetup7\ISCC.exe --version
      - name: Compile installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          C:\InnoSetup7\ISCC.exe -q "/DAppVersion=$version" "/DBinDir=$PWD\bins" "/O$PWD\dist" packaging\windows\pooprusteek.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: dist/pooprusteek-setup.exe
          retention-days: 7
