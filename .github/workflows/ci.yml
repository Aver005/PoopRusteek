name: CI

# Проверки на каждый пуш и PR. Пуш в develop сверх того собирает и публикует
# rolling-релиз `dev` — канал обновлений `dev` (src/update/mod.rs). Стабильные
# релизы делает release.yml по тегу v* (scripts/release.sh).

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - '.memories/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.memories/**'
      - 'LICENSE'

# PR-прогоны отменяются, пуши — нет: отмена посреди публикации оставила бы канал `dev` пустым.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    uses: ./.github/workflows/build.yml

  publish-dev:
    name: Publish dev release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets

      - name: Read version
        id: ver
        shell: bash
        run: |
          echo "version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%s' "${{ github.sha }}" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Collect assets, manifest and checksums
        shell: bash
        run: bash scripts/ci/collect-assets.sh release-assets "${{ steps.ver.outputs.version }}" "$TAG" "${{ github.sha }}"

      - name: Capture previous dev build commit
        id: prev
        shell: bash
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            PREV_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            echo "sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
            echo "label=\`$(printf '%s' "$PREV_SHA" | cut -c1-8)\`" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "label=(none — first dev build)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute changelog since previous dev build
        id: log
        shell: bash
        run: |
          PREV="${{ steps.prev.outputs.sha }}"
          if [ -n "$PREV" ] && [ "$PREV" != "${{ github.sha }}" ]; then
            RANGE="$PREV..${{ github.sha }}"
            COUNT=$(git rev-list --count "$RANGE")
            FILES=$(git diff --name-only "$RANGE" | wc -l | tr -d ' ')
            LOG=$(git log --pretty=format:'- %s (`%h`)' "$RANGE")
            CONTRIBUTORS=$(git log --pretty=format:'%an' "$RANGE" | sort -u | awk 'NR>1{printf ", "}{printf "%s", $0}')
          else
            COUNT=0
            FILES=0
            LOG="_First dev build — no prior history to diff against._"
            CONTRIBUTORS="—"
          fi
          {
            echo "count=$COUNT"
            echo "files=$FILES"
            echo "contributors=$CONTRIBUTORS"
            echo "log<<GHA_EOF_LOG"
            echo "$LOG"
            echo "GHA_EOF_LOG"
          } >> "$GITHUB_OUTPUT"

      - name: Compute artifact list
        id: artifacts
        shell: bash
        run: |
          cd release-assets
          COUNT=$(ls -1 | wc -l | tr -d ' ')
          LIST=$(for f in *; do printf -- '- `%s` (%s)\n' "$f" "$(du -h "$f" | cut -f1)"; done)
          {
            echo "count=$COUNT"
            echo "list<<GHA_EOF_ARTIFACTS"
            echo "$LIST"
            echo "GHA_EOF_ARTIFACTS"
          } >> "$GITHUB_OUTPUT"

      - name: Render release notes
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PREVIOUS_TAG: ${{ steps.prev.outputs.label }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          PUSHED_BY: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_COUNT_SINCE_LAST_BUILD: ${{ steps.log.outputs.count }}
          COMMITS_SINCE_LAST_BUILD: ${{ steps.log.outputs.log }}
          CONTRIBUTORS_SINCE_LAST_BUILD: ${{ steps.log.outputs.contributors }}
          CHANGED_FILES_COUNT: ${{ steps.log.outputs.files }}
          ARTIFACT_COUNT: ${{ steps.artifacts.outputs.count }}
          ARTIFACT_LIST: ${{ steps.artifacts.outputs.list }}
        run: |
          export COMMIT_SHORT_SHA="$(printf '%s' "$COMMIT_SHA" | cut -c1-8)"
          export COMMIT_TITLE="$(printf '%s\n' "$COMMIT_MESSAGE" | head -1)"
          export RUST_VERSION="$(rustc --version)"
          export BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          bash scripts/render-release-notes.sh scripts/dev-release.template.md release-body.md \
            TAG VERSION PREVIOUS_TAG BRANCH REPO REPO_URL \
            COMMIT_SHA COMMIT_SHORT_SHA COMMIT_TITLE COMMIT_MESSAGE \
            COMMIT_AUTHOR_NAME COMMIT_AUTHOR_EMAIL COMMIT_TIMESTAMP \
            PUSHED_BY BUILD_DATE RUN_ID RUN_URL RUST_VERSION \
            COMMIT_COUNT_SINCE_LAST_BUILD COMMITS_SINCE_LAST_BUILD \
            CONTRIBUTORS_SINCE_LAST_BUILD CHANGED_FILES_COUNT \
            ARTIFACT_COUNT ARTIFACT_LIST

      # Rolling-релиз: тег `dev` переезжает на текущий коммит, релиз обновляется на месте.
      - name: Move `dev` tag to current commit
        shell: bash
        run: |
          git tag -f "$TAG"
          git push origin "$TAG" --force

      # Без удаления релиза канал не пропадает; manifest.json грузится последним,
      # чтобы клиенты не увидели новый манифест раньше новых бинарников.
      - name: Publish `dev` release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: "Dev build ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.short }})"
          prerelease: true
          make_latest: "false"
          body_path: release-body.md
          preserve_order: true
          fail_on_unmatched_files: true
          files: |
            release-assets/pooprusteek-*
            release-assets/install.sh
            release-assets/SHA256SUMS
            release-assets/manifest.json
