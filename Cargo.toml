[package]
name = "pooprusteek"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "A fast, beautiful TUI coding agent powered by DeepSeek"
license = "MIT"

[[bin]]
name = "pooprusteek"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "net",
    "process",
    "signal",
    "sync",
    "time",
    "io-util",
    "io-std",
] }
# TUI
# `unstable-rendered-line-info` exposes Paragraph::line_count — the real
# WordWrapper row count used for scroll math (estimates diverge on CJK/wrap).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# HTTP
reqwest = { version = "0.13", features = ["json", "stream", "cookies", "rustls", "multipart", "form"], default-features = false }
# HTTP server (`/serve` API mode) — hyper directly instead of a framework:
# three routes don't justify axum's tower stack, and hyper 1.x is already in
# the dependency tree via reqwest.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
color-eyre = "0.6"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
toml = "1"
dirs = "7"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async streams
futures = "0.3"
async-trait = "0.1"

# Markdown / syntax
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
textwrap = "0.16"
unicode-width = "0.2"
base64 = "0.23"
regex = "1"
wasmtime = { version = "27", default-features = false, features = [
    "std",
    "cranelift",
    "runtime",
] }

# MCP OAuth: encrypted token storage, browser launch, PKCE challenge
keyring = "4.2"
open = "5"
sha2 = "0.11"

# PTY for interactive CLI tools (arrow-key menus, REPLs)
portable-pty = "0.9"

# Semantic skill matching: local ONNX embeddings (multilingual-e5-small) +
# Snowball stemming for the sparse half of the hybrid match. Slimmed
# features: no image models, rustls instead of native-tls (matches reqwest).
fastembed = { version = "5.17.2", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }
rust-stemmers = "1.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
# GlobalMemoryStatusEx (auto-size embedder batch) + SetStdHandle (redirect
# stderr into errors.log so ONNX Runtime's output can't corrupt the TUI) +
# Job Objects (kill-on-close so detached background jobs can't outlive a
# force-closed app; see tools::background::types::win_job) + Registry (sync the
# installer's DisplayVersion after a self-update; see update::install_record).
windows-sys = { version = "0.60", features = [
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# libc for: total physical RAM (macOS sysctl hw.memsize; auto-size embedder
# batch) and stderr fd redirect into errors.log (dup2, all unix).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Rust 1.97's new `linker_messages` lint surfaces everything the linker
# prints. MSVC's link.exe unconditionally emits an informational "Creating
# library …pooprusteek.lib and object …pooprusteek.exp" line whenever the
# exe exports symbols (wasmtime's runtime does) — and it's localized, so a
# Russian-locale toolchain shows it as `?????…` mojibake on top. Purely
# informational and not actionable from our side: allow it. A specific
# lint level outranks the `warnings` group, so `-D warnings` runs are
# unaffected by design.
[lints.rust]
linker_messages = "allow"

# Nursery lint, outside clippy's default groups. `deny`, not `warn`: a specific
# level outranks `-D warnings` (above). `needless_collect` misfires here, stays off.
[lints.clippy]
redundant_clone = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
