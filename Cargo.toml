[package]
name = "pooprusteek"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A fast, beautiful TUI coding agent powered by DeepSeek"
license = "MIT"

[[bin]]
name = "pooprusteek"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# TUI
# `unstable-rendered-line-info` exposes Paragraph::line_count — the real
# WordWrapper row count used for scroll math (estimates diverge on CJK/wrap).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# HTTP
reqwest = { version = "0.13", features = ["json", "stream", "cookies", "rustls", "multipart"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
color-eyre = "0.6"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
toml = "1"
dirs = "6"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async streams
futures = "0.3"
async-trait = "0.1"

# Markdown / syntax
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
textwrap = "0.16"
unicode-width = "0.2"
base64 = "0.22"
regex = "1"
wasmtime = "27"

# PTY for interactive CLI tools (arrow-key menus, REPLs)
portable-pty = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
