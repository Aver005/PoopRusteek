# Config template for the sandbox container. The entrypoint copies this to
# $XDG_CONFIG_HOME/pooprusteek/config.toml and substitutes the token from the
# POOPRUSTEEK_TOKEN environment variable, so no secret is ever baked into an
# image layer.
#
# Deliberate differences from a desktop config:
#   - rate limits off, since the sandbox is where throughput matters;
#   - `update.auto = false`, so a run never swaps its own binary mid-suite;
#   - a `mock` provider entry pointing at the compose-network mock service,
#     so `--provider mock` works without editing anything.

[provider]
kind = "deepseek"
token = "__POOPRUSTEEK_TOKEN__"
model = "deepseek-chat"
temperature = 0.7
max_tokens = 4096

[ui]
theme = "catppuccin"
custom_themes = []

[agent]
max_steps_per_turn = 32
max_tools_per_step = 10
# A modest throttle, and it is load-bearing. With no throttle at all a
# three-repeat suite tripped DeepSeek's own limiter, which answers HTTP 200
# and then sends `{"type":"error",...,"finish_reason":"rate_limit_reached"}`
# inside the stream. Roughly one run in three came back having done nothing.
# 3000ms is what a prompt A/B run needed: rate-limit failures are noise that
# would swamp the effect being measured. Repeats already run one at a time
# (`--concurrency 1`), and each is its own process, so the in-process limiter
# cannot coordinate across them — the spacing has to be generous enough that
# it does not need to.
rate_limit_ms = 3000
rate_limit_per_minute = 0
max_retries = 2

[mcp]
cache_ttl = 300

[skills]
enabled = []
paths = []

[semantic]
enabled = true
top_k = 3
min_dense_score = 0.8
mcp_schemas = "auto"
rag_limit = "auto"

# The scripted endpoint from `sandbox mock`. Reachable as `mock` on the
# compose network and as localhost when the mock runs in the same container.
[[providers]]
name = "mock"
base_url = "http://mock:811/v1"
api_key = "mock"
model = "mock"
protocol = "openai"

[server]
host = "0.0.0.0"
port = 11111
api = "openai"

[provider_models]
refetch_ms = 180000
cache_ms = 180000

[update]
auto = false
