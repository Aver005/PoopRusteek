# Prompt A/B: greenfield under variant D-role.
# Variant: role and tone only, no explicit rule — separates a stated rule from general exhortation.
# Task: the task the baseline fails by announcing the work and stopping.
#
# Every scenario in this directory differs from its siblings in exactly one
# field: `system_prompt_append`. That is the whole point.
name = "greenfield-D-role"
description = "greenfield / D-role"
prompt = """
Create a small static todo page in the current directory. Three files: index.html, style.css, script.js. Typing a task and pressing the button must add it to a visible list. No frameworks, no build step, no CDN links - plain HTML, CSS and JS. index.html must link both other files.
"""
workspace_template = "../../fixtures/empty"
system_prompt_append = "../../prompts/D-role-framing.md"
timeout = 300
max_steps = 14
repeat = 3

[expect]
status = "completed"
files_exist = ["index.html", "style.css", "script.js"]
min_pass_rate = 1.0

[[expect.file_matches]]
path = "index.html"
pattern = 'style\.css'

[[expect.file_matches]]
path = "index.html"
pattern = 'script\.js'

[[expect.file_matches]]
path = "script.js"
pattern = '(?i)addEventListener|onclick'
