# AGENTS.md рабочей папки попадает в системный промпт.
#
# Улики две: `instructions.loaded` называет число найденных файлов, размер
# секции и область загрузки, а `system_prompt.assembled` печатает
# `instructions=N` — размер той же секции в собранном промпте. Одного счётчика
# файлов мало: он не отличит найденный файл от вклеенного. `workspace`, а не
# `workspace_template`: сценарий ничего не пишет.
#
#   ./sandbox.ps1 mock reads-project-instructions
name = "reads-project-instructions"
description = "AGENTS.md in the workspace reaches the system prompt"
prompt = "What is the magic word for this project?"
workspace = "instructions-workspace"
provider = "mock"
timeout = 60
max_steps = 3

[expect]
status = "completed"
min_pass_rate = 1.0

# Улика — счётчик источников, а не размер секции. Харнесс грузит правила
# герметично: `instructions::Scope::WorkspaceOnly` (с 2026-09-06), поэтому
# подъёма к корню репозитория и к глобальному `~/.pooprusteek` нет. В области
# `first_in_dir` берёт один файл правил на папку, значит у сценария ровно один
# источник — свой `AGENTS.md` в шаблоне. Ноль означал бы, что файл потерян или
# не прочитался; два в этой области невозможны.
[[expect.trace]]
action = "instructions.loaded"
field = "files"
min_total = 1
max_total = 1

# И размер секции настоящий: найденный, но пустой файл не читается
# (`read_rules` отбрасывает пустой текст), так что ноль здесь поймал бы
# подмену содержимого или потерю секции при сборке промпта.
[[expect.trace]]
action = "instructions.loaded"
field = "bytes"
min_total = 1
