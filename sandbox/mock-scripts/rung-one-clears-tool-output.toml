# Script for `scenarios/mock/rung-one-clears-tool-output.toml`. Three big
# reads, then an answer — enough tool output to push the conversation past
# rung 1's 70% trigger while the turn is still running.
#
#   ./sandbox.ps1 mock rung-one-clears-tool-output
#
# On the host, without Docker:
#   pooprusteek mock-provider --port 811 \
#     --script sandbox/mock-scripts/rung-one-clears-tool-output.toml

[[reply]]
content = """
Reading the first log.
<tool_use>
<name>read_file</name>
<arguments>
{"path": "alpha.txt"}
</arguments>
</tool_use>
"""

[[reply]]
content = """
Reading the second log.
<tool_use>
<name>read_file</name>
<arguments>
{"path": "beta.txt"}
</arguments>
</tool_use>
"""

[[reply]]
content = """
Reading the third log.
<tool_use>
<name>read_file</name>
<arguments>
{"path": "gamma.txt"}
</arguments>
</tool_use>
"""

# The last positional reply repeats, so the turn ends here however many steps
# the loop has left.
[[reply]]
content = "All three logs are compaction fixtures: 120 lines each, worker 0 through 2."
